  </header>

  <main id="app">

    <section
      id="palette"
      class="palette"
      aria-label="Nail polish palette"
    ></section>

    <div id="filter-popover" class="filter-popover" hidden>
      <div class="popover-header">
        <strong>choose colors</strong>

        <button
          id="close-filters"
          class="icon-button"
          type="button"
          aria-label="Close"
        >×</button>
      </div>

      <p class="popover-help">
        choose one or more. no selection = any color.
      </p>

      <div id="tag-list" class="tag-list"></div>

      <button
        id="done-filters"
        class="done-button"
        type="button"
      >done</button>
    </div>

    <div
      id="toast"
      class="toast"
      role="status"
      aria-live="polite"
    ></div>

  </main>

  <script src="script.js"></script>
